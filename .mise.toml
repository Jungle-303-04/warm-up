[tools]
node = "24.16.0"
pnpm = "10.17.0"
python = "3.12"
uv = "0.9.17"

[tasks.setup]
description = "Install JavaScript and Python dependencies"
run = [
  "corepack enable",
  "pnpm install",
  "uv sync --project backend"
]

[tasks."compose:config"]
description = "Validate Docker Compose configuration"
run = "docker compose config --quiet"

[tasks."compose:up"]
description = "Start the local RepoPilot pipeline"
run = "docker compose up --build"

[tasks."compose:debug"]
description = "Start the local RepoPilot pipeline with VS Code debug ports"
run = "docker compose -f compose.yaml -f compose.debug.yaml up --build"

[tasks."compose:debug:api"]
description = "Start the FastAPI debug target with backing services"
run = "docker compose -f compose.yaml -f compose.debug.yaml up --build api postgres redis"

[tasks."compose:down"]
description = "Stop the local RepoPilot pipeline"
run = "docker compose down"

[tasks."compose:logs"]
description = "Follow pipeline logs"
run = "docker compose logs -f"

[tasks."api:test"]
description = "Run backend tests"
dir = "backend"
run = "uv run pytest"

[tasks."api:typecheck"]
description = "Run Pyright with the VS Code import configuration"
run = "pnpm api:typecheck"

[tasks."web:typecheck"]
description = "Type-check the web app"
run = "pnpm --filter @repopilot/web typecheck"

[tasks.check]
description = "Run lightweight local checks"
depends = ["compose:config", "api:typecheck", "api:test", "web:typecheck"]
