services:
  api:
    image: repolm-api:debug
    build:
      context: ./backend
      target: dev
    command:
      - /app/.venv/bin/python
      - -Xfrozen_modules=off
      - -m
      - debugpy
      - --listen
      - 0.0.0.0:5678
      - -m
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8000:8000"
      - "5678:5678"

  web:
    environment:
      NODE_OPTIONS: --inspect=0.0.0.0:9229
    ports:
      - "3000:3000"
      - "9229:9229"
