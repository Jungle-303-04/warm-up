name: repopilot

x-backend-env: &backend-env
  REPOPILOT_ENV: ${REPOPILOT_ENV:-local}
  PYTHONPATH: /app
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://repopilot:repopilot@postgres:5432/repopilot}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
  GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
  GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
  SESSION_JWT_SECRET: ${SESSION_JWT_SECRET:-dev-insecure-session-secret}
  WEB_APP_URL: ${WEB_APP_URL:-http://localhost:3000}

x-backend-service: &backend-service
  image: repopilot-api:local
  build:
    context: ./backend
  environment:
    <<: *backend-env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/repo/apps/web
      - web_node_modules:/repo/node_modules
      - web_app_node_modules:/repo/apps/web/node_modules
      - web_next:/repo/apps/web/.next
    depends_on:
      api:
        condition: service_healthy

  api:
    <<: *backend-service
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # repo-sync 워커만 실제 sync 큐를 폴링해 인덱싱 파이프라인을 돌린다.
  # code-index/rag-index/agent는 전용 큐가 생기기 전까지 placeholder(heartbeat)다.
  worker-repo-sync:
    <<: *backend-service
    command: ["python", "-m", "app.workers.runner", "repo-sync"]
    volumes:
      - ./backend/app:/app/app

  worker-code-index:
    <<: *backend-service
    command: ["python", "-m", "app.workers.runner", "code-index"]
    volumes:
      - ./backend/app:/app/app

  worker-rag:
    <<: *backend-service
    command: ["python", "-m", "app.workers.runner", "rag-index"]
    volumes:
      - ./backend/app:/app/app

  worker-agent:
    <<: *backend-service
    command: ["python", "-m", "app.workers.runner", "agent-proposal"]
    volumes:
      - ./backend/app:/app/app

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-repopilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repopilot}
      POSTGRES_DB: ${POSTGRES_DB:-repopilot}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-repopilot} -d ${POSTGRES_DB:-repopilot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  web_node_modules:
  web_app_node_modules:
  web_next:
