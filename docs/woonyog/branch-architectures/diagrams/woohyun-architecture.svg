    <text x="94" y="236" class="item">• React 19</text>
<text x="94" y="260" class="item">• Vite 8</text>
<text x="94" y="284" class="item">• React Router</text>
<text x="94" y="308" class="item">• Dashboard</text>
<text x="94" y="332" class="item">• GitHub Page</text>
<text x="94" y="356" class="item">• Notion Page</text>
<text x="94" y="380" class="item">• RAG Page</text>
<text x="94" y="404" class="item">• API modules</text>
  </g>

  <g>
    <rect x="430" y="150" width="310" height="300" rx="12" class="box"/>
    <rect x="430" y="150" width="310" height="48" rx="12" class="boxHead"/>
    <line x1="430" y1="198" x2="740" y2="198" class="rule"/>
    <text x="585" y="181" text-anchor="middle" class="sectionTitle">Backend</text>
    <text x="454" y="236" class="item">• FastAPI</text>
<text x="454" y="260" class="item">• psycopg 3</text>
<text x="454" y="284" class="item">• Raw SQL</text>
<text x="454" y="308" class="item">• PyJWT</text>
<text x="454" y="332" class="item">• OpenAI Responses</text>
<text x="454" y="356" class="item">• GitHub/Notion integrations</text>
