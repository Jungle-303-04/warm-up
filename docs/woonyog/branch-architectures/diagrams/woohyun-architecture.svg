<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="820" viewBox="0 0 1420 820" role="img" aria-label="woohyun · AI Team Sync Board">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555" />
    </marker>
    <style>
      .bg { fill: #f7f7f7; }
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #171717; }
      .subtitle { font: 500 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #595959; }
      .box { fill: #ffffff; stroke: #a3a3a3; stroke-width: 1.4; }
      .boxHead { fill: #eeeeee; stroke: none; }
      .rule { stroke: #a3a3a3; stroke-width: 1.2; }
      .sectionTitle { font: 700 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #262626; }
      .item { font: 500 15px -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif; fill: #333333; }
      .arrow { stroke: #555; stroke-width: 2; fill: none; }
      .labelBg { fill: #f7f7f7; stroke: #c7c7c7; }
      .flowLabel { font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #333333; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="bg"/>
  <text x="710" y="70" text-anchor="middle" class="title">woohyun · AI Team Sync Board</text>
  <text x="710" y="102" text-anchor="middle" class="subtitle">프론트엔드 · 백엔드 · 데이터베이스 · AI/RAG/MCP 연결 구조</text>
  
  <g>
    <rect x="70" y="150" width="280" height="300" rx="12" class="box"/>
