  <g>
    <rect x="810" y="150" width="310" height="300" rx="12" class="box"/>
    <rect x="810" y="150" width="310" height="48" rx="12" class="boxHead"/>
    <line x1="810" y1="198" x2="1120" y2="198" class="rule"/>
    <text x="965" y="181" text-anchor="middle" class="sectionTitle">Database</text>
    <text x="834" y="236" class="item">• PostgreSQL</text>
<text x="834" y="260" class="item">• pgvector</text>
<text x="834" y="284" class="item">• users/posts/comments/tags</text>
<text x="834" y="308" class="item">• notion_documents</text>
<text x="834" y="332" class="item">• document_embeddings vector(1536)</text>
<text x="834" y="356" class="item">• HNSW index</text>
  </g>

  <g>
    <rect x="430" y="520" width="500" height="230" rx="12" class="box"/>
    <rect x="430" y="520" width="500" height="48" rx="12" class="boxHead"/>
    <line x1="430" y1="568" x2="930" y2="568" class="rule"/>
    <text x="680" y="551" text-anchor="middle" class="sectionTitle">AI/RAG</text>
    <text x="454" y="606" class="item">• today briefing</text>
<text x="454" y="630" class="item">• team summary</text>
<text x="454" y="654" class="item">• sync documents</text>
<text x="454" y="678" class="item">• ask docs</text>
<text x="454" y="702" class="item">• OpenAI embeddings</text>
<text x="454" y="726" class="item">• JSON Schema answers</text>
  </g>
  
  <g>
    <line x1="350" y1="300" x2="430" y2="300" class="arrow" marker-end="url(#arrow)"/>
    <rect x="336" y="284" width="108" height="26" rx="13" class="labelBg"/>
    <text x="390" y="305" text-anchor="middle" class="flowLabel">Bearer/JSON</text>
  </g>

  <g>
    <line x1="740" y1="300" x2="810" y2="300" class="arrow" marker-end="url(#arrow)"/>
    <rect x="721" y="284" width="108" height="26" rx="13" class="labelBg"/>
    <text x="775" y="305" text-anchor="middle" class="flowLabel">raw SQL + pgvector</text>
  </g>

  <g>
    <line x1="740" y1="300" x2="430" y2="635" class="arrow" marker-end="url(#arrow)"/>
    <rect x="531" y="451.5" width="108" height="26" rx="13" class="labelBg"/>
    <text x="585" y="472.5" text-anchor="middle" class="flowLabel">/ai/*</text>
  </g>

  <g>
    <line x1="930" y1="635" x2="810" y2="300" class="arrow" marker-end="url(#arrow)"/>
    <rect x="816" y="451.5" width="108" height="26" rx="13" class="labelBg"/>
    <text x="870" y="472.5" text-anchor="middle" class="flowLabel">embedding search</text>
