<svg xmlns="http://www.w3.org/2000/svg" width="1750" height="1110" viewBox="0 0 1750 1110" role="img" aria-label="chanbin2 · TeamLog 페이지 저장 흐름">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563" />
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 800 34px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #111827; }
      .subtitle { font: 500 15px -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif; fill: #5b6472; }
      .lane { stroke-width: 1.2; }
      .lane.user { fill: #eef4ff; stroke: #7d96c7; }
      .lane.frontend { fill: #f7f7f7; stroke: #a3a3a3; }
      .lane.backend { fill: #f3f0ff; stroke: #9585c7; }
      .lane.llm { fill: #effbf4; stroke: #70a982; }
      .lane.rag { fill: #eef6ff; stroke: #74a5d8; }
      .lane.mcp { fill: #fff5e8; stroke: #d59b55; }
      .lane.db { fill: #f4f4f5; stroke: #8e8e8e; }
      .laneTitle { font: 800 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #1f2937; }
      .laneSub { font: 500 12px -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif; fill: #606a78; }
      .card { stroke-width: 1.1; filter: drop-shadow(0 2px 4px rgba(15, 23, 42, 0.10)); }
      .card.user { fill: #f8fbff; stroke: #7d96c7; }
      .card.frontend { fill: #ffffff; stroke: #a3a3a3; }
      .card.backend { fill: #fbfaff; stroke: #9585c7; }
      .card.llm { fill: #f7fff9; stroke: #70a982; }
      .card.rag { fill: #f8fbff; stroke: #74a5d8; }
      .card.mcp { fill: #fffaf2; stroke: #d59b55; }
      .card.db { fill: #ffffff; stroke: #8e8e8e; }
      .badge { fill: #2563eb; }
      .badgeText { font: 800 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #ffffff; }
      .cardTitle { font: 800 14px -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif; fill: #1f2937; }
      .cardText { font: 500 12.5px -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif; fill: #374151; }
      .arrow { stroke: #4b5563; stroke-width: 1.8; fill: none; }
      .arrowLabelBg { fill: #ffffff; stroke: #d1d5db; }
      .arrowLabel { font: 700 11px -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif; fill: #374151; }
      .summaryBox { fill: #f9fafb; stroke: #cbd5e1; }
      .summaryTitle { font: 800 14px -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif; fill: #1f2937; }
      .summaryText { font: 500 12.5px -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif; fill: #4b5563; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="bg"/>
  <text x="875" y="45" text-anchor="middle" class="title">chanbin2 · TeamLog 페이지 저장 흐름</text>
  <text x="875" y="72" text-anchor="middle" class="subtitle">가입/로그인 후 회의록·회고 페이지와 블록을 PostgreSQL에 저장하는 초기 API 흐름</text>
  <g>
    <rect x="50" y="96" width="185" height="62" rx="10" class="lane user"/>
    <text x="142.5" y="122" text-anchor="middle" class="laneTitle">User</text>
    <text x="142.5" y="144" text-anchor="middle" class="laneSub">입력/확인</text>
  </g>
  <g>
    <rect x="285" y="96" width="185" height="62" rx="10" class="lane frontend"/>
    <text x="377.5" y="122" text-anchor="middle" class="laneTitle">Frontend</text>
    <text x="377.5" y="144" text-anchor="middle" class="laneSub">화면/상태</text>
  </g>
  <g>
    <rect x="520" y="96" width="185" height="62" rx="10" class="lane backend"/>
    <text x="612.5" y="122" text-anchor="middle" class="laneTitle">FastAPI</text>
    <text x="612.5" y="144" text-anchor="middle" class="laneSub">검증/분기/조립</text>
  </g>
  <g>
    <rect x="780" y="96" width="185" height="62" rx="10" class="lane llm"/>
    <text x="872.5" y="122" text-anchor="middle" class="laneTitle">LLM</text>
    <text x="872.5" y="144" text-anchor="middle" class="laneSub">분석/생성</text>
  </g>
  <g>
    <rect x="1035" y="96" width="185" height="62" rx="10" class="lane rag"/>
    <text x="1127.5" y="122" text-anchor="middle" class="laneTitle">RAG / Search</text>
    <text x="1127.5" y="144" text-anchor="middle" class="laneSub">검색/근거</text>
  </g>
  <g>
    <rect x="1280" y="96" width="185" height="62" rx="10" class="lane mcp"/>
    <text x="1372.5" y="122" text-anchor="middle" class="laneTitle">AI/RAG 상태</text>
    <text x="1372.5" y="144" text-anchor="middle" class="laneSub">도구/외부</text>
  </g>
  <g>
    <rect x="1515" y="96" width="185" height="62" rx="10" class="lane db"/>
    <text x="1607.5" y="122" text-anchor="middle" class="laneTitle">Database</text>
    <text x="1607.5" y="144" text-anchor="middle" class="laneSub">영속 저장</text>
  </g>
  <g>
    <path d="M 235 250 C 260 250, 260 250, 285 250" class="arrow" marker-end="url(#arrow)"/>
    <rect x="210" y="235" width="100" height="24" rx="12" class="arrowLabelBg"/>
    <text x="260" y="253" text-anchor="middle" class="arrowLabel">입력</text>
  </g>
<g>
    <path d="M 470 250 C 495 250, 495 259, 520 259" class="arrow" marker-end="url(#arrow)"/>
    <rect x="445" y="239.5" width="100" height="24" rx="12" class="arrowLabelBg"/>
    <text x="495" y="257.5" text-anchor="middle" class="arrowLabel">HTTP</text>
  </g>
<g>
    <path d="M 705 259 C 1110 259, 1110 259, 1515 259" class="arrow" marker-end="url(#arrow)"/>
    <rect x="1060" y="244" width="100" height="24" rx="12" class="arrowLabelBg"/>
    <text x="1110" y="262" text-anchor="middle" class="arrowLabel">SQL</text>
  </g>
<g>
    <path d="M 235 484 C 377.5 484, 377.5 484, 520 484" class="arrow" marker-end="url(#arrow)"/>
    <rect x="327.5" y="469" width="100" height="24" rx="12" class="arrowLabelBg"/>
    <text x="377.5" y="487" text-anchor="middle" class="arrowLabel">payload</text>
  </g>
<g>
    <path d="M 705 484 C 1110 484, 1110 493, 1515 493" class="arrow" marker-end="url(#arrow)"/>
    <rect x="1060" y="473.5" width="100" height="24" rx="12" class="arrowLabelBg"/>
    <text x="1110" y="491.5" text-anchor="middle" class="arrowLabel">ORM</text>
  </g>
<g>
    <path d="M 1700 493 C 875 493, 875 835, 50 835" class="arrow" marker-end="url(#arrow)"/>
    <rect x="825" y="649" width="100" height="24" rx="12" class="arrowLabelBg"/>
    <text x="875" y="667" text-anchor="middle" class="arrowLabel">response</text>
  </g>
<g>
    <path d="M 470 713 C 875 713, 875 704, 1280 704" class="arrow" marker-end="url(#arrow)"/>
    <rect x="825" y="693.5" width="100" height="24" rx="12" class="arrowLabelBg"/>
    <text x="875" y="711.5" text-anchor="middle" class="arrowLabel">health</text>
  </g>
<g>
    <path d="M 470 713 C 260 713, 260 835, 50 835" class="arrow" marker-end="url(#arrow)"/>
    <rect x="210" y="759" width="100" height="24" rx="12" class="arrowLabelBg"/>
    <text x="260" y="777" text-anchor="middle" class="arrowLabel">화면</text>
  </g>
  <g id="step-1">
      <rect x="50" y="205" width="185" height="90" rx="12" class="card user"/>
      <circle cx="72" cy="229" r="13" class="badge"/>
      <text x="72" y="234" text-anchor="middle" class="badgeText">1</text>
      <text x="93" y="234" class="cardTitle">가입/로그인</text>
      <text x="68" y="261" class="cardText">이메일, 비밀번호, 닉네임 입력</text>
    </g>
<g id="step-2">
      <rect x="285" y="205" width="185" height="90" rx="12" class="card frontend"/>
      <circle cx="307" cy="229" r="13" class="badge"/>
      <text x="307" y="234" text-anchor="middle" class="badgeText">2</text>
      <text x="328" y="234" class="cardTitle">Axios 요청</text>
      <text x="303" y="261" class="cardText">VITE_API_BASE_URL 기준</text>
<text x="303" y="277" class="cardText">API 호출</text>
    </g>
<g id="step-3">
      <rect x="520" y="205" width="185" height="108" rx="12" class="card backend"/>
      <circle cx="542" cy="229" r="13" class="badge"/>
      <text x="542" y="234" text-anchor="middle" class="badgeText">3</text>
      <text x="563" y="234" class="cardTitle">Auth 처리</text>
      <text x="538" y="261" class="cardText">비밀번호 hash/verify</text>
<text x="538" y="297" class="cardText">JWT access token 발급</text>
    </g>
<g id="step-4">
      <rect x="1515" y="205" width="185" height="108" rx="12" class="card db"/>
      <circle cx="1537" cy="229" r="13" class="badge"/>
      <text x="1537" y="234" text-anchor="middle" class="badgeText">4</text>
      <text x="1558" y="234" class="cardTitle">User 저장/조회</text>
      <text x="1533" y="261" class="cardText">users table</text>
<text x="1533" y="297" class="cardText">email unique</text>
    </g>
<g id="step-5">
      <rect x="50" y="430" width="185" height="108" rx="12" class="card user"/>
      <circle cx="72" cy="454" r="13" class="badge"/>
      <text x="72" y="459" text-anchor="middle" class="badgeText">5</text>
      <text x="93" y="459" class="cardTitle">페이지 입력</text>
      <text x="68" y="486" class="cardText">회의록/회고 제목</text>
<text x="68" y="522" class="cardText">날짜, 시간, 블록</text>
    </g>
<g id="step-6">
      <rect x="520" y="430" width="185" height="108" rx="12" class="card backend"/>
      <circle cx="542" cy="454" r="13" class="badge"/>
      <text x="542" y="459" text-anchor="middle" class="badgeText">6</text>
      <text x="563" y="459" class="cardTitle">Page 생성</text>
      <text x="538" y="486" class="cardText">POST /pages</text>
<text x="538" y="522" class="cardText">current_user 확인</text>
    </g>
<g id="step-7">
      <rect x="1515" y="430" width="185" height="126" rx="12" class="card db"/>
      <circle cx="1537" cy="454" r="13" class="badge"/>
      <text x="1537" y="459" text-anchor="middle" class="badgeText">7</text>
      <text x="1558" y="459" class="cardTitle">ORM commit</text>
      <text x="1533" y="486" class="cardText">pages</text>
<text x="1533" y="522" class="cardText">page_blocks</text>
<text x="1533" y="558" class="cardText">comments 관계</text>
    </g>
<g id="step-8">
      <rect x="285" y="650" width="185" height="126" rx="12" class="card frontend"/>
      <circle cx="307" cy="674" r="13" class="badge"/>
      <text x="307" y="679" text-anchor="middle" class="badgeText">8</text>
      <text x="328" y="679" class="cardTitle">상태 표시</text>
      <text x="303" y="706" class="cardText">health</text>
<text x="303" y="742" class="cardText">db-health</text>
<text x="303" y="778" class="cardText">pgvector-health</text>
    </g>
<g id="step-9">
      <rect x="1280" y="650" width="185" height="108" rx="12" class="card mcp"/>
      <circle cx="1302" cy="674" r="13" class="badge"/>
      <text x="1302" y="679" text-anchor="middle" class="badgeText">9</text>
      <text x="1323" y="679" class="cardTitle">AI/RAG 미연결</text>
      <text x="1298" y="706" class="cardText">vector extension 확인</text>
<text x="1298" y="742" class="cardText">실제 검색/LLM 없음</text>
    </g>
<g id="step-10">
      <rect x="50" y="790" width="185" height="90" rx="12" class="card user"/>
      <circle cx="72" cy="814" r="13" class="badge"/>
      <text x="72" y="819" text-anchor="middle" class="badgeText">10</text>
      <text x="93" y="819" class="cardTitle">응답 확인</text>
      <text x="68" y="846" class="cardText">저장 결과 또는 연결 상태 확인</text>
    </g>
  <g>
      <rect x="50" y="1000" width="330" height="74" rx="12" class="summaryBox"/>
      <text x="68" y="1028" class="summaryTitle">사용자</text>
      <text x="68" y="1054" class="summaryText">로그인 후 페이지 정보를 입력</text>
    </g>
<g>
      <rect x="395" y="1000" width="330" height="74" rx="12" class="summaryBox"/>
      <text x="413" y="1028" class="summaryTitle">FastAPI</text>
      <text x="413" y="1054" class="summaryText">auth/pages 라우터에서 검증</text>
    </g>
<g>
      <rect x="740" y="1000" width="330" height="74" rx="12" class="summaryBox"/>
      <text x="758" y="1028" class="summaryTitle">DB</text>
      <text x="758" y="1054" class="summaryText">User/Page/Block/Comment 저장</text>
    </g>
<g>
      <rect x="1085" y="1000" width="330" height="74" rx="12" class="summaryBox"/>
      <text x="1103" y="1028" class="summaryTitle">AI/RAG</text>
      <text x="1103" y="1054" class="summaryText">pgvector health만 연결된 단계</text>
    </g>
</svg>