  <rect width="100%" height="100%" class="bg"/>
  <text x="875" y="45" text-anchor="middle" class="title">minjeong · GitHub RAG 답변 흐름</text>
  <text x="875" y="72" text-anchor="middle" class="subtitle">GitHub OAuth, 레포 인덱싱, SQL/Chroma 저장, LangGraph 기반 근거 답변 흐름</text>
  <g>
    <rect x="50" y="96" width="185" height="62" rx="10" class="lane user"/>
