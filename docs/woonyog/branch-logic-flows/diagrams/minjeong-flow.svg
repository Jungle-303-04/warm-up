      .card.llm { fill: #f7fff9; stroke: #70a982; }
      .card.rag { fill: #f8fbff; stroke: #74a5d8; }
      .card.mcp { fill: #fffaf2; stroke: #d59b55; }
      .card.db { fill: #ffffff; stroke: #8e8e8e; }
