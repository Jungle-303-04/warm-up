      .cardTitle { font: 800 14px -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif; fill: #1f2937; }
      .cardText { font: 500 12.5px -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif; fill: #374151; }
      .arrow { stroke: #4b5563; stroke-width: 1.8; fill: none; }
