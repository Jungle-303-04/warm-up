      <text x="538" y="641" class="cardText">repo/branch/commit</text>
<text x="538" y="657" class="cardText">scope 고정</text>
    </g>
<g id="step-11">
      <rect x="1035" y="585" width="185" height="108" rx="12" class="card rag"/>
      <circle cx="1057" cy="609" r="13" class="badge"/>
      <text x="1057" y="614" text-anchor="middle" class="badgeText">11</text>
      <text x="1078" y="614" class="cardTitle">retrieve_vector</text>
      <text x="1053" y="641" class="cardText">Chroma 검색</text>
<text x="1053" y="677" class="cardText">metadata row 변환</text>
    </g>
<g id="step-12">
      <rect x="780" y="585" width="185" height="108" rx="12" class="card llm"/>
      <circle cx="802" cy="609" r="13" class="badge"/>
      <text x="802" y="614" text-anchor="middle" class="badgeText">12</text>
      <text x="823" y="614" class="cardTitle">근거 답변 생성</text>
      <text x="798" y="641" class="cardText">근거 있으면 LLM 호출</text>
<text x="798" y="677" class="cardText">없으면 no-evidence</text>
    </g>
<g id="step-13">
      <rect x="285" y="800" width="185" height="126" rx="12" class="card frontend"/>
      <circle cx="307" cy="824" r="13" class="badge"/>
      <text x="307" y="829" text-anchor="middle" class="badgeText">13</text>
