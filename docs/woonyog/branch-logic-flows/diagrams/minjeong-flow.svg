      <text x="1533" y="421" class="cardText">rag_index_run</text>
<text x="1533" y="457" class="cardText">rag_chunk</text>
<text x="1533" y="493" class="cardText">vector store</text>
    </g>
<g id="step-9">
      <rect x="50" y="585" width="185" height="90" rx="12" class="card user"/>
      <circle cx="72" cy="609" r="13" class="badge"/>
