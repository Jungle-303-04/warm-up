      .laneSub { font: 500 12px -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif; fill: #606a78; }
      .card { stroke-width: 1.1; filter: drop-shadow(0 2px 4px rgba(15, 23, 42, 0.10)); }
