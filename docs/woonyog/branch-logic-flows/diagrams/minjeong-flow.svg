      <text x="68" y="421" class="cardText">repository_full_name</text>
<text x="68" y="457" class="cardText">branch 입력</text>
    </g>
<g id="step-6">
      <rect x="520" y="365" width="185" height="108" rx="12" class="card backend"/>
      <circle cx="542" cy="389" r="13" class="badge"/>
      <text x="542" y="394" text-anchor="middle" class="badgeText">6</text>
      <text x="563" y="394" class="cardTitle">Repository index</text>
      <text x="538" y="421" class="cardText">GitHub 파일 수집</text>
<text x="538" y="457" class="cardText">snapshot 생성</text>
    </g>
<g id="step-7">
      <rect x="1035" y="365" width="185" height="108" rx="12" class="card rag"/>
      <circle cx="1057" cy="389" r="13" class="badge"/>
      <text x="1057" y="394" text-anchor="middle" class="badgeText">7</text>
      <text x="1078" y="394" class="cardTitle">Chunking</text>
      <text x="1053" y="421" class="cardText">Python/Markdown</text>
<text x="1053" y="437" class="cardText">chunker</text>
<text x="1053" y="457" class="cardText">citation 생성</text>
    </g>
<g id="step-8">
      <rect x="1515" y="365" width="185" height="126" rx="12" class="card db"/>
      <circle cx="1537" cy="389" r="13" class="badge"/>
      <text x="1537" y="394" text-anchor="middle" class="badgeText">8</text>
