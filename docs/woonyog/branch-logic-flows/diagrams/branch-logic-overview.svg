<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930" role="img" aria-label="5개 브랜치 핵심 로직 흐름 비교">
    <defs><style>
      .bg { fill: #ffffff; }
      .title { font: 800 36px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #111827; }
      .sub { font: 500 16px -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif; fill: #5b6472; }
      .row { fill: #f9fafb; stroke: #cbd5e1; stroke-width: 1.2; }
      .branch { font: 800 24px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #1f2937; }
      .kind { font: 700 15px -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif; fill: #4b5563; }
      .flow { font: 700 18px -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif; fill: #111827; }
      .note { font: 500 15px -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif; fill: #64748b; }
    </style></defs>
    <rect width="100%" height="100%" class="bg"/>
    <text x="800" y="68" text-anchor="middle" class="title">5개 브랜치 핵심 로직 흐름 비교</text>
    <text x="800" y="103" text-anchor="middle" class="sub">사용자 입력부터 백엔드, LLM, RAG, MCP, DB, 최종 응답까지 이어지는 흐름</text>
    <g>
      <rect x="60" y="150" width="1480" height="104" rx="14" class="row"/>
      <text x="105" y="186" class="branch">chanbin2</text>
      <text x="105" y="220" class="kind">TeamLog 페이지 저장</text>
      <text x="410" y="188" class="flow">사용자 입력 -&gt; FastAPI auth/pages -&gt; SQLAlchemy ORM -&gt; PostgreSQL</text>
      <text x="410" y="222" class="note">AI/RAG는 health check 수준</text>
    </g>
<g>
      <rect x="60" y="285" width="1480" height="104" rx="14" class="row"/>
      <text x="105" y="321" class="branch">minjeong</text>
      <text x="105" y="355" class="kind">GitHub RAG 답변</text>
      <text x="410" y="323" class="flow">OAuth -&gt; GitHub files -&gt; chunk -&gt; SQL/Chroma -&gt; LangGraph answer</text>
      <text x="410" y="357" class="note">근거 있음/없음 분기</text>
    </g>
<g>
      <rect x="60" y="420" width="1480" height="104" rx="14" class="row"/>
      <text x="105" y="456" class="branch">gain</text>
      <text x="105" y="490" class="kind">AI 폰트 추천</text>
      <text x="410" y="458" class="flow">글 분석 -&gt; RAG guide -&gt; MCP font 후보/상세 -&gt; LLM 선택</text>
      <text x="410" y="492" class="note">Agent 조립이 핵심</text>
    </g>
<g>
      <rect x="60" y="555" width="1480" height="104" rx="14" class="row"/>
      <text x="105" y="591" class="branch">woohyun</text>
      <text x="105" y="625" class="kind">AI Team Sync Board</text>
      <text x="410" y="593" class="flow">보드/GitHub/Notion context -&gt; OpenAI 브리핑 -&gt; pgvector 질의</text>
      <text x="410" y="627" class="note">팀 요약과 문서 검색</text>
    </g>
<g>
      <rect x="60" y="690" width="1480" height="104" rx="14" class="row"/>
      <text x="105" y="726" class="branch">woonyong</text>
      <text x="105" y="760" class="kind">RepoLM 제품 흐름</text>
      <text x="410" y="728" class="flow">source indexing -&gt; planner -&gt; RAG -&gt; tool/citation -&gt; artifacts</text>
      <text x="410" y="762" class="note">제품 통합 기준 브랜치</text>
    </g>
  </svg>