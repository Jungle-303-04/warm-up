[project]
name = "repolm-api"
version = "0.1.0"
description = "Minimal RepoLM API and worker runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "httpx>=0.28.0,<1.0.0",
  "langchain>=1.3.7",
  "langchain-openai>=0.2.0",
  "langchain-text-splitters>=0.3.0",
  "langgraph>=1.0.0,<2.0.0",
  "pyjwt>=2.9.0,<3.0.0",
  "openai>=1.40.0",
  "pgvector>=0.3.0,<1.0.0",
  "psycopg[binary]>=3.2.0,<4.0.0",
  "pydantic-settings>=2.7.0,<3.0.0",
  "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
  "tenacity>=9.0.0,<10.0.0",
  "structlog>=24.4.0,<26.0.0",
  "typer>=0.15.0,<1.0.0",
  "uvicorn[standard]>=0.34.0,<1.0.0",
  "mcp>=0.4.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
  "debugpy>=1.8.0,<2.0.0",
  "httpx2>=2.3.0",
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.25.0,<2.0.0",
  "ruff>=0.8.0,<1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F=pyflakes·pycodestyle, I=isort, UP=pyupgrade, B=bugbear, SIM=simplify, RUF=ruff
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI는 기본인자에 Depends(...)를 쓰는 패턴이 정상

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
