[project]
name = "repopilot-api"
version = "0.1.0"
description = "Minimal RepoPilot API and worker runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
  "asyncpg>=0.30.0,<1.0.0",
  "fastapi>=0.115.0,<1.0.0",
  "httpx>=0.28.0,<1.0.0",
  "pgvector>=0.3.0,<1.0.0",
  "pydantic-settings>=2.7.0,<3.0.0",
  "redis>=5.2.0,<7.0.0",
  "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
  "structlog>=24.4.0,<26.0.0",
  "typer>=0.15.0,<1.0.0",
  "uvicorn[standard]>=0.34.0,<1.0.0"
]

[dependency-groups]
dev = [
  "debugpy>=1.8.0,<2.0.0",
  "httpx2>=2.3.0",
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.25.0,<2.0.0",
  "ruff>=0.8.0,<1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py312"
